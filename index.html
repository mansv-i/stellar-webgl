<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar — Real-time WebGL Galaxy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030307;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e6ed;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .hud {
      position: absolute;
      top: 24px;

      gap: 6px;

      text-transform: uppercase;

    }
    .hud p {
      font-size: 0.85rem;

    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(10, 14, 24, 0.7);

      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);

      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    }

      opacity: 0;
      pointer-events: none;

  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <div class="hud" id="hud">
    <h1>Stellar</h1>
    <p>250,000 GPU Particles &bull; Drag to orbit &bull; Click for Supernova</p>
  </div>

  <div class="controls" id="controls">
    <button id="btn-palette">Palette: Cyan/Magenta</button>
    <button id="btn-audio">Audio: Off</button>
    <button id="btn-photo">Photo Mode</button>
  </div>

  <script>
    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
    if (!gl) alert('WebGL 2.0 is required for this demo.');

    const NUM_STARS = 250000;

    // --- Shaders ---
    const vsSource = `#version 300 es
    layout(location = 0) in float a_index;

    uniform mat4 u_mvp;
    uniform float u_time;
    uniform vec3 u_shockwave; // x, y, timeElapsed
    uniform vec2 u_cursor;    // galaxy plane (x, z)
    uniform float u_paletteIndex;

    out vec3 v_color;
    out float v_alpha;

    #define PI 3.14159265359

    // Pseudo-random hash
    float hash(float n) { return fract(sin(n) * 43758.5453123); }

    void main() {
      float seed = a_index;
      float rNorm = hash(seed * 1.13);
      float radius = pow(rNorm, 1.8) * 22.0 + 0.15; // Spiral radius density

      // 2 spiral arms
      float armOffset = mod(a_index, 2.0) * PI;
      float angle = radius * -0.65 + armOffset;

      // Vertical & radial spread
      float spread = exp(-radius * 0.18) * 1.2;
      float xDisp = (hash(seed * 2.71) - 0.5) * spread * 2.2;
      float zDisp = (hash(seed * 3.14) - 0.5) * spread * 2.2;
      float yDisp = (hash(seed * 4.93) - 0.5) * spread * 0.9;

      // Differential orbital rotation
      float orbitalSpeed = 0.85 / (sqrt(radius) + 0.35);
      float curAngle = angle + u_time * orbitalSpeed * 0.25;

      vec3 pos = vec3(
        cos(curAngle) * radius + xDisp,
        yDisp,
        sin(curAngle) * radius + zDisp
      );

      // Mouse gravity attraction
      vec2 diff = pos.xz - u_cursor;
      float distToCursor = length(diff);
      if (distToCursor < 6.0 && distToCursor > 0.001) {
        float pull = (1.0 - distToCursor / 6.0) * 1.1;
        pos.xz -= (diff / distToCursor) * pull;
        pos.y += sin(distToCursor * 3.0 - u_time * 4.0) * pull * 0.3;
      }

      // Supernova shockwave
      if (u_shockwave.z >= 0.0) {
        float waveRadius = u_shockwave.z * 18.0;
        float dCenter = length(pos.xz - u_shockwave.xy);
        float waveDist = abs(dCenter - waveRadius);
        if (waveDist < 2.5) {
          float strength = (1.0 - waveDist / 2.5) * exp(-u_shockwave.z * 1.2);
          pos.y += sin(waveDist * PI) * strength * 2.8;
          pos.xz += normalize(pos.xz - u_shockwave.xy + 0.0001) * strength * 1.5;
        }
      }

      // Palettes: 0: Cosmic Pink/Blue, 1: Golden Amber, 2: Emerald Nebula
      vec3 coreColor = vec3(1.0, 0.95, 0.85);
      vec3 midColor  = (u_paletteIndex == 0.0) ? vec3(0.05, 0.65, 1.0) :
                       (u_paletteIndex == 1.0) ? vec3(1.0, 0.5, 0.1) : vec3(0.1, 0.9, 0.6);
      vec3 outerColor = (u_paletteIndex == 0.0) ? vec3(0.9, 0.15, 0.65) :
                        (u_paletteIndex == 1.0) ? vec3(0.8, 0.1, 0.05) : vec3(0.05, 0.3, 0.9);

      float tRadius = clamp(radius / 18.0, 0.0, 1.0);
      vec3 col = (tRadius < 0.25) ? mix(coreColor, midColor, tRadius / 0.25)
                                  : mix(midColor, outerColor, (tRadius - 0.25) / 0.75);

      v_color = col * (1.0 + hash(seed * 7.7) * 0.6);
      v_alpha = clamp(1.2 - tRadius * 0.65, 0.2, 1.0);

      gl_Position = u_mvp * vec4(pos, 1.0);
      gl_PointSize = clamp((35.0 / gl_Position.w) * (hash(seed * 8.9) * 1.5 + 0.6), 1.0, 16.0);
    }
    `;

    const fsSource = `#version 300 es
    precision highp float;

    in vec3 v_color;
    in float v_alpha;
    out vec4 fragColor;

    void main() {
      vec2 coord = gl_PointCoord - vec2(0.5);
      float distSq = dot(coord, coord);
      if (distSq > 0.25) discard;

      // Soft gaussian-like falloff
      float glow = exp(-distSq * 14.0);
      float core = exp(-distSq * 60.0);
      vec3 finalCol = v_color * glow + vec3(core);

      fragColor = vec4(finalCol, v_alpha * glow);
    }
    `;

    // --- WebGL Helper & Pipeline Setup ---
    function createShader(gl, type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);

    const uMvp = gl.getUniformLocation(program, 'u_mvp');
    const uTime = gl.getUniformLocation(program, 'u_time');
    const uShockwave = gl.getUniformLocation(program, 'u_shockwave');
    const uCursor = gl.getUniformLocation(program, 'u_cursor');
    const uPaletteIndex = gl.getUniformLocation(program, 'u_paletteIndex');

    const indices = new Float32Array(NUM_STARS);
    for (let i = 0; i < NUM_STARS; i++) indices[i] = i;

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, indices, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);

    // --- State & Matrix Math ---
    let width, height;
    let yaw = 0.5, pitch = 0.65, camDist = 32.0;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;
    let shockwave = [0, 0, -1.0];
    let cursorCoords = [9999, 9999];
    let paletteIdx = 0;
    const palettes = ['Cyan/Magenta', 'Golden Amber', 'Emerald Sea'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      gl.viewport(0, 0, width, height);
    }
    window.addEventListener('resize', resize);
    resize();

    // 4x4 matrix helpers
    function mat4Perspective(fov, aspect, near, far) {
      const f = 1.0 / Math.tan(fov / 2);
      const nf = 1 / (near - far);
      return [
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, (2 * far * near) * nf, 0
      ];
    }

    function mat4Multiply(a, b) {
      const out = new Float32Array(16);
      for (let r = 0; r < 4; ++r) {
        for (let c = 0; c < 4; ++c) {
          out[c * 4 + r] =
            a[r] * b[c * 4] +
            a[r + 4] * b[c * 4 + 1] +
            a[r + 8] * b[c * 4 + 2] +
            a[r + 12] * b[c * 4 + 3];
        }
      }
      return out;
    }

    function mat4LookAt(eye, center, up) {
      let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
      let len = 1 / Math.hypot(z0, z1, z2);
      z0 *= len; z1 *= len; z2 *= len;

      let x0 = up[1] * z2 - up[2] * z1,
          x1 = up[2] * z0 - up[0] * z2,
          x2 = up[0] * z1 - up[1] * z0;
      len = Math.hypot(x0, x1, x2);
      if (len) { len = 1 / len; x0 *= len; x1 *= len; x2 *= len; }

      let y0 = z1 * x2 - z2 * x1,
          y1 = z2 * x0 - z0 * x2,
          y2 = z0 * x1 - z1 * x0;

      return [
        x0, y0, z0, 0,
        x1, y1, z1, 0,
        x2, y2, z2, 0,
        -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]),
        -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]),
        -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]),
        1
      ];
    }

    // --- Audio Synthesis (Web Audio API) ---
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(55, audioCtx.currentTime); // Low A drone

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(140, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    function triggerSupernovaSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 1.2);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    }

    // --- Event Listeners ---
    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        yaw += (e.clientX - lastMouseX) * 0.006;
        pitch = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, pitch - (e.clientY - lastMouseY) * 0.006));
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }

      // Approximate plane intersection for gravity cursor
      const ndcX = (e.clientX / width) * 2 - 1;
      const ndcY = -(e.clientY / height) * 2 + 1;
      cursorCoords = [ndcX * 16.0, ndcY * 16.0];
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging && Math.abs(e.clientX - lastMouseX) < 3 && Math.abs(e.clientY - lastMouseY) < 3) {
        // Trigger supernova shockwave at galactic center
        shockwave = [cursorCoords[0] * 0.5, cursorCoords[1] * 0.5, 0.0];
        triggerSupernovaSound();
      }
      isDragging = false;
    });

    window.addEventListener('wheel', (e) => {
      camDist = Math.max(8.0, Math.min(80.0, camDist + e.deltaY * 0.04));
    }, { passive: true });

    // Buttons
    document.getElementById('btn-palette').addEventListener('click', (e) => {
      paletteIdx = (paletteIdx + 1) % palettes.length;
      e.target.textContent = `Palette: ${palettes[paletteIdx]}`;
    });

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        btnAudio.textContent = 'Audio: On';
      } else if (audioCtx.state === 'running') {
        audioCtx.suspend();
        btnAudio.textContent = 'Audio: Off';
      }
    });

    let photoMode = false;
    document.getElementById('btn-photo').addEventListener('click', () => {
      photoMode = !photoMode;
      document.getElementById('hud').classList.toggle('hidden', photoMode);
      document.getElementById('controls').classList.toggle('hidden', photoMode);
    });

    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') {
        photoMode = !photoMode;
        document.getElementById('hud').classList.toggle('hidden', photoMode);
        document.getElementById('controls').classList.toggle('hidden', photoMode);
      }
    });

    // --- Render Loop ---
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE); // Additive blending for realistic star clusters
    gl.clearColor(0.012, 0.012, 0.027, 1.0);

    let startTime = performance.now();

    function render(time) {
      const elapsed = (time - startTime) * 0.001;

      if (!isDragging) {
        yaw += 0.0015; // Slow ambient orbit
      }

      if (shockwave[2] >= 0.0) {
        shockwave[2] += 0.016;
        if (shockwave[2] > 2.5) shockwave[2] = -1.0;
      }

      gl.clear(gl.COLOR_BUFFER_BIT);

      // Camera calculations
      const eyeX = camDist * Math.cos(pitch) * Math.sin(yaw);
      const eyeY = camDist * Math.sin(pitch);
      const eyeZ = camDist * Math.cos(pitch) * Math.cos(yaw);

      const proj = mat4Perspective(45 * Math.PI / 180, width / height, 0.1, 200.0);
      const view = mat4LookAt([eyeX, eyeY, eyeZ], [0, 0, 0], [0, 1, 0]);
      const mvp = mat4Multiply(proj, view);

      gl.useProgram(program);
      gl.uniformMatrix4fv(uMvp, false, mvp);
      gl.uniform1f(uTime, elapsed);
      gl.uniform3fv(uShockwave, shockwave);
      gl.uniform2fv(uCursor, cursorCoords);
      gl.uniform1f(uPaletteIndex, paletteIdx);

      gl.bindVertexArray(vao);
      gl.drawArrays(gl.POINTS, 0, NUM_STARS);

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
