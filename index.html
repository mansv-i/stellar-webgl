<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellar — Real-time WebGL Galaxy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020205;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e0e6ed;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .hud {
      position: absolute;
      top: 24px;
      left: 24px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
      transition: opacity 0.3s ease;
    }
    .hud h1 {
      font-size: 1.45rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-weight: 800;
      color: #fff;
    }
    .hud p {
      font-size: 0.82rem;
      color: #94a3b8;
      letter-spacing: 0.06em;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      background: rgba(10, 14, 24, 0.75);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      transition: opacity 0.3s ease;
    }
    button {
      background: transparent;
      border: none;
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <div class="hud" id="hud">
    <h1>Stellar</h1>
    <p>250,000 GPU Particles &bull; Drag to orbit &bull; Click anywhere for Supernova</p>
  </div>

  <div class="controls" id="controls">
    <button id="btn-palette">Palette: Cyan/Magenta</button>
    <button id="btn-audio">Audio: Off</button>
    <button id="btn-photo">Photo Mode</button>
  </div>

  <script>
    const canvas = document.getElementById('glcanvas');
    const gl = canvas.getContext('webgl2', { antialias: false, powerPreference: 'high-performance' });
    if (!gl) alert('WebGL 2.0 required.');

    const NUM_STARS = 250000;

    const vsSource = `#version 300 es
    layout(location = 0) in float a_index;

    uniform mat4 u_mvp;
    uniform float u_time;
    uniform vec3 u_shockwave;
    uniform vec2 u_cursor;
    uniform float u_paletteIndex;

    out vec3 v_color;
    out float v_alpha;

    #define PI 3.14159265359

    float hash(float n) { return fract(sin(n) * 43758.5453123); }

    float gaussian(float n) {
      return sqrt(-2.0 * log(max(hash(n), 0.0001))) * cos(2.0 * PI * hash(n * 1.618));
    }

    void main() {
      float id = a_index;
      float rnd1 = hash(id * 1.13);
      float rnd2 = hash(id * 2.71);
      float rnd3 = hash(id * 4.93);

      // Smooth exponential disk distribution without an artificial core cutoff
      float radius = -3.8 * log(max(1.0 - rnd1 * 0.98, 0.0001));

      // Density wave spiral structure
      float armBase = (mod(id, 2.0) == 0.0) ? 0.0 : PI;
      float winding = -1.65 * log(radius * 0.45 + 1.0);
      float armSpread = gaussian(id * 3.14) * (0.35 + radius * 0.045);

      // 30% background disk stars fill between the arms
      float isInterArm = step(0.70, rnd3);
      float angle = isInterArm * (rnd2 * 2.0 * PI) + (1.0 - isInterArm) * (armBase + winding + armSpread);

      // Galactic scale height (thicker bulge at the center, thinner disc outwards)
      float heightScale = 0.35 + exp(-radius * 0.22) * 1.8;
      float yPos = gaussian(id * 7.89) * 0.28 * heightScale;

      // Differential orbital rotation
      float vOrbit = 1.1 / (pow(radius + 0.6, 0.55));
      float curAngle = angle + u_time * vOrbit * 0.20;

      vec3 pos = vec3(
        cos(curAngle) * radius,
        yPos,
        sin(curAngle) * radius
      );

      // Cursor gravity well
      vec2 diff = pos.xz - u_cursor;
      float distToCursor = length(diff);
      if (distToCursor < 6.5 && distToCursor > 0.001) {
        float pull = (1.0 - distToCursor / 6.5) * 1.4;
        pos.xz -= (diff / distToCursor) * pull;
        pos.y += sin(distToCursor * 3.5 - u_time * 5.0) * pull * 0.55;
      }

      // Supernova shockwave
      if (u_shockwave.z >= 0.0) {
        float waveRadius = u_shockwave.z * 24.0;
        float dCenter = length(pos.xz - u_shockwave.xy);
        float waveDist = abs(dCenter - waveRadius);
        if (waveDist < 3.2) {
          float strength = (1.0 - waveDist / 3.2) * exp(-u_shockwave.z * 0.85);
          pos.y += sin(waveDist * PI) * strength * 4.0;
          pos.xz += normalize(pos.xz - u_shockwave.xy + 0.0001) * strength * 2.2;
        }
      }

      // Color mapping
      vec3 coreCol  = vec3(1.0, 0.94, 0.82);
      vec3 midCol   = (u_paletteIndex == 0.0) ? vec3(0.08, 0.72, 1.0) :
                      (u_paletteIndex == 1.0) ? vec3(1.0, 0.55, 0.12) : vec3(0.15, 0.95, 0.65);
      vec3 outerCol = (u_paletteIndex == 0.0) ? vec3(0.96, 0.20, 0.74) :
                      (u_paletteIndex == 1.0) ? vec3(0.95, 0.14, 0.06) : vec3(0.08, 0.40, 0.98);

      float tRadius = clamp(radius / 18.0, 0.0, 1.0);
      vec3 col = (tRadius < 0.18) ? mix(coreCol, midCol, tRadius / 0.18)
                                  : mix(midCol, outerCol, (tRadius - 0.18) / 0.82);

      v_color = col * (1.1 + hash(id * 9.1) * 0.9);
      v_alpha = clamp(1.4 - tRadius * 0.65, 0.25, 1.0);

      gl_Position = u_mvp * vec4(pos, 1.0);
      gl_PointSize = clamp((38.0 / gl_Position.w) * (hash(id * 3.3) * 1.5 + 0.6), 1.0, 16.0);
    }
    `;

    const fsSource = `#version 300 es
    precision highp float;

    in vec3 v_color;
    in float v_alpha;
    out vec4 fragColor;

    void main() {
      vec2 coord = gl_PointCoord - vec2(0.5);
      float distSq = dot(coord, coord);
      if (distSq > 0.25) discard;

      float glow = exp(-distSq * 11.0);
      float core = exp(-distSq * 45.0);
      vec3 finalCol = v_color * glow + vec3(core * 1.4);

      fragColor = vec4(finalCol, v_alpha * glow);
    }
    `;

    function createShader(gl, type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
      return s;
    }

    const program = gl.createProgram();
    gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
    gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
    gl.linkProgram(program);

    const uMvp = gl.getUniformLocation(program, 'u_mvp');
    const uTime = gl.getUniformLocation(program, 'u_time');
    const uShockwave = gl.getUniformLocation(program, 'u_shockwave');
    const uCursor = gl.getUniformLocation(program, 'u_cursor');
    const uPaletteIndex = gl.getUniformLocation(program, 'u_paletteIndex');

    const indices = new Float32Array(NUM_STARS);
    for (let i = 0; i < NUM_STARS; i++) indices[i] = i;

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, indices, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 1, gl.FLOAT, false, 0, 0);

    let width, height;
    let yaw = 0.5, pitch = 0.65, camDist = 32.0;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;
    let clickStartX = 0, clickStartY = 0;
    let shockwave = [0, 0, -1.0];
    let cursorCoords = [9999, 9999];
    let paletteIdx = 0;
    const palettes = ['Cyan/Magenta', 'Golden Amber', 'Emerald Sea'];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      gl.viewport(0, 0, width, height);
    }
    window.addEventListener('resize', resize);
    resize();

    function mat4Perspective(fov, aspect, near, far) {
      const f = 1.0 / Math.tan(fov / 2);
      const nf = 1 / (near - far);
      return [
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, (2 * far * near) * nf, 0
      ];
    }

    function mat4Multiply(a, b) {
      const out = new Float32Array(16);
      for (let r = 0; r < 4; ++r) {
        for (let c = 0; c < 4; ++c) {
          out[c * 4 + r] =
            a[r] * b[c * 4] +
            a[r + 4] * b[c * 4 + 1] +
            a[r + 8] * b[c * 4 + 2] +
            a[r + 12] * b[c * 4 + 3];
        }
      }
      return out;
    }

    function mat4LookAt(eye, center, up) {
      let z0 = eye[0] - center[0], z1 = eye[1] - center[1], z2 = eye[2] - center[2];
      let len = 1 / Math.hypot(z0, z1, z2);
      z0 *= len; z1 *= len; z2 *= len;

      let x0 = up[1] * z2 - up[2] * z1,
          x1 = up[2] * z0 - up[0] * z2,
          x2 = up[0] * z1 - up[1] * z0;
      len = Math.hypot(x0, x1, x2);
      if (len) { len = 1 / len; x0 *= len; x1 *= len; x2 *= len; }

      let y0 = z1 * x2 - z2 * x1,
          y1 = z2 * x0 - z0 * x2,
          y2 = z0 * x1 - z1 * x0;

      return [
        x0, y0, z0, 0,
        x1, y1, z1, 0,
        x2, y2, z2, 0,
        -(x0 * eye[0] + x1 * eye[1] + x2 * eye[2]),
        -(y0 * eye[0] + y1 * eye[1] + y2 * eye[2]),
        -(z0 * eye[0] + z1 * eye[1] + z2 * eye[2]),
        1
      ];
    }

    function getPlaneIntersection(screenX, screenY) {
      const ndcX = (screenX / width) * 2 - 1;
      const ndcY = -(screenY / height) * 2 + 1;

      const eye = [
        camDist * Math.cos(pitch) * Math.sin(yaw),
        camDist * Math.sin(pitch),
        camDist * Math.cos(pitch) * Math.cos(yaw)
      ];

      const fov = 45 * Math.PI / 180;
      const aspect = width / height;
      const tanFov = Math.tan(fov / 2);

      const forward = [-eye[0], -eye[1], -eye[2]];
      const fLen = Math.hypot(...forward);
      forward[0] /= fLen; forward[1] /= fLen; forward[2] /= fLen;

      const right = [forward[2], 0, -forward[0]];
      const rLen = Math.hypot(...right);
      if (rLen > 0.001) { right[0] /= rLen; right[2] /= rLen; }

      const up = [
        right[1] * forward[2] - right[2] * forward[1],
        right[2] * forward[0] - right[0] * forward[2],
        right[0] * forward[1] - right[1] * forward[0]
      ];

      const rayDir = [
        forward[0] + right[0] * ndcX * tanFov * aspect + up[0] * ndcY * tanFov,
        forward[1] + right[1] * ndcX * tanFov * aspect + up[1] * ndcY * tanFov,
        forward[2] + right[2] * ndcX * tanFov * aspect + up[2] * ndcY * tanFov
      ];

      if (Math.abs(rayDir[1]) < 0.001) return [9999, 9999];
      const t = -eye[1] / rayDir[1];
      if (t < 0) return [9999, 9999];

      return [eye[0] + rayDir[0] * t, eye[2] + rayDir[2] * t];
    }

    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(55, audioCtx.currentTime);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(140, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    function triggerSupernovaSound() {
      if (!audioCtx || audioCtx.state !== 'running') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(240, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 1.4);

      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.4);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.4);
    }

    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isDragging = true;
      lastMouseX = clickStartX = e.clientX;
      lastMouseY = clickStartY = e.clientY;
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        yaw += (e.clientX - lastMouseX) * 0.006;
        pitch = Math.max(0.08, Math.min(Math.PI / 2 - 0.05, pitch - (e.clientY - lastMouseY) * 0.006));
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      }
      cursorCoords = getPlaneIntersection(e.clientX, e.clientY);
    });

    window.addEventListener('mouseup', (e) => {
      const moved = Math.hypot(e.clientX - clickStartX, e.clientY - clickStartY);
      if (moved < 5 && e.target.tagName !== 'BUTTON') {
        const hit = getPlaneIntersection(e.clientX, e.clientY);
        shockwave = [hit[0], hit[1], 0.0];
        triggerSupernovaSound();
      }
      isDragging = false;
    });

    window.addEventListener('wheel', (e) => {
      camDist = Math.max(8.0, Math.min(80.0, camDist + e.deltaY * 0.04));
    }, { passive: true });

    document.getElementById('btn-palette').addEventListener('click', (e) => {
      paletteIdx = (paletteIdx + 1) % palettes.length;
      e.target.textContent = `Palette: ${palettes[paletteIdx]}`;
    });

    const btnAudio = document.getElementById('btn-audio');
    btnAudio.addEventListener('click', () => {
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
        btnAudio.textContent = 'Audio: On';
      } else if (audioCtx.state === 'running') {
        audioCtx.suspend();
        btnAudio.textContent = 'Audio: Off';
      }
    });

    let photoMode = false;
    const toggleHUD = () => {
      photoMode = !photoMode;
      document.getElementById('hud').classList.toggle('hidden', photoMode);
      document.getElementById('controls').classList.toggle('hidden', photoMode);
    };
    document.getElementById('btn-photo').addEventListener('click', toggleHUD);
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'h') toggleHUD();
    });

    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.clearColor(0.012, 0.012, 0.024, 1.0);

    const startTime = performance.now();

    function render(time) {
      const elapsed = (time - startTime) * 0.001;

      if (!isDragging) {
        yaw += 0.0012;
      }

      if (shockwave[2] >= 0.0) {
        shockwave[2] += 0.015;
        if (shockwave[2] > 2.5) shockwave[2] = -1.0;
      }

      gl.clear(gl.COLOR_BUFFER_BIT);

      const eye = [
        camDist * Math.cos(pitch) * Math.sin(yaw),
        camDist * Math.sin(pitch),
        camDist * Math.cos(pitch) * Math.cos(yaw)
      ];

      const proj = mat4Perspective(45 * Math.PI / 180, width / height, 0.1, 200.0);
      const view = mat4LookAt(eye, [0, 0, 0], [0, 1, 0]);
      const mvp = mat4Multiply(proj, view);

      gl.useProgram(program);
      gl.uniformMatrix4fv(uMvp, false, mvp);
      gl.uniform1f(uTime, elapsed);
      gl.uniform3fv(uShockwave, shockwave);
      gl.uniform2fv(uCursor, cursorCoords);
      gl.uniform1f(uPaletteIndex, paletteIdx);

      gl.bindVertexArray(vao);
      gl.drawArrays(gl.POINTS, 0, NUM_STARS);

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
